[workspace]
resolver = "2"
members  = [
  "contracts/entry-point",
  "contracts/adapters/ibc/*",
  "contracts/adapters/swap/*",
  "contracts/placeholder",
  "packages/*",
]

[workspace.package]
version       = "0.1.0"
authors       = ["Cogwheel"]
edition       = "2024"
rust-version  = "1.99.0"
license       = "Apache-2.0"
homepage      = "https://portal.thespectra.io/"
repository    = "https://github.com/Cogwheel-Validator/spectra-portal-cosmwasm-contracts"
documentation = "https://github.com/Cogwheel-Validator/spectra-portal-cosmwasm-contracts#readme"
keywords      = ["cosmwasm"]

[workspace.dependencies]
astroport            = "2.9"
oroswap              = { package = "oroswap-core", git = "https://github.com/oroswap/oroswap-core", tag = "v1.1.0" }
cosmwasm-schema      = "1.5.4"
cosmwasm-std         = { version = "1.5.4", features = ["stargate"] }
cosmos-sdk-proto     = { version = "0.19", default-features = false }
cw2                  = "1.1"
cw20                 = "1.1"
cw-storage-plus      = "1"
cw-utils             = "1.0.3"
ibc-proto            = { version = "0.32.1", default-features = false }
neutron-proto        = { version = "0.1.1", default-features = false, features = ["cosmwasm"] }
osmosis-std          = "0.15.3"
elys-std          = "0.1.0"
prost                = "0.11"
serde-cw-value       = "0.7.0"
serde-json-wasm      = "1.0.1"
skip                 = { version = "0.1.0", path = "./packages/skip" }
skip2                = { version = "0.1.0", path = "./packages/skip2" }
test-case            = "3.3.1"
thiserror            = "1"
white-whale-std      = "1.1.1"

[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 3
overflow-checks  = true
rpath            = false
